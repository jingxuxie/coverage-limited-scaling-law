name: validate

on:
  push:
  pull_request:

jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make validate
      - run: python -m py_compile experiments/multi_active_replay.py experiments/frontier_diagnostics.py experiments/plot_results.py experiments/validate_results.py

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-plain-generic cm-super dvipng poppler-utils
      - run: make figures
      - name: Compile paper and supplement
        run: |
          set -euo pipefail
          cd paper
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error supplement.tex
          pdflatex -interaction=nonstopmode -halt-on-error supplement.tex
          ! grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations|Overfull \\hbox|Overfull \\vbox" main.log supplement.log
          test "$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')" -le 10
          pdftotext -f 7 -l 7 main.pdf - | grep -q "Conclusion"
          pdftotext -f 8 -l 8 main.pdf - | grep -q "References"
          for pdf in main.pdf supplement.pdf figures/*.pdf; do
            pdffonts "$pdf" | tail -n +3 | \
              awk '$0 ~ /Type 3|Identity-H/ || $(NF-4) != "yes" { bad=1 } END { exit bad }'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: submission-pdfs
          path: |
            paper/main.pdf
            paper/supplement.pdf
