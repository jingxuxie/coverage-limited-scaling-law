name: validate

on:
  push:
  pull_request:

jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make validate
      - run: python -m py_compile experiments/multi_active_replay.py experiments/plot_results.py experiments/validate_results.py
