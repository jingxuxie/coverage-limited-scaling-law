name: apply expanded AAAI paper

on:
  push:
    branches:
      - agent/expand-aaai-paper
    paths:
      - ".agent_expand/TRIGGER"
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-aaai-paper
          fetch-depth: 0

      - name: Unpack source revision
        shell: bash
        run: |
          set -euo pipefail
          cat .agent_expand/part-* > /tmp/source_payload.b64
          base64 --decode /tmp/source_payload.b64 > /tmp/source_payload.tar.gz
          echo "1aaacc7293b6c6b276c1460392d5abe2e34f5d525b037b17749654553a085d44  /tmp/source_payload.tar.gz" | sha256sum --check
          tar -xzf /tmp/source_payload.tar.gz
          cp AAAI_AuthorKit27/aaai2027.bst paper/aaai2027.bst
          python - <<'PY'
          from pathlib import Path

          main = Path("paper/main.tex")
          text = main.read_text()
          style = r"\bibliographystyle{../AAAI_AuthorKit27/aaai2027}"
          if style not in text:
              raise SystemExit("expected redundant bibliography-style declaration not found")
          text = text.replace(
              style,
              "% aaai2027.sty selects the required aaai2027 bibliography style.",
              1,
          )

          marker = (
              "The progressive subset is a conservative achievability construction rather\n"
              "than a claim that discarding data is optimal. At fixed update compute, the\n"
              "experiments consistently favor more unique examples.\n\n"
          )
          if marker not in text:
              raise SystemExit("main-paper budget insertion marker not found")
          budget = Path(".agent_expand/budget_main.tex").read_text()
          text = text.replace(marker, marker + budget + "\n", 1)
          main.write_text(text)

          supplement = Path("paper/supplement.tex")
          supp_text = supplement.read_text()
          supp_marker = "\\section{Input-Only Saturation Estimation}\n"
          if supp_marker not in supp_text:
              raise SystemExit("supplement budget insertion marker not found")
          supp_budget = Path(".agent_expand/budget_supp.tex").read_text()
          supplement.write_text(
              supp_text.replace(supp_marker, supp_budget + "\n" + supp_marker, 1)
          )
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate the new capacity and stopping diagnostics
        run: python experiments/frontier_diagnostics.py --mode full --out experiments/results

      - name: Validate all checked-in and newly generated results
        run: make validate

      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-plain-generic texlive-bibtex-extra \
            tex-gyre cm-super dvipng poppler-utils
          kpsewhich ts1-qtmr.tfm
          command -v bibtex

      - name: Regenerate publication figures
        run: make figures

      - name: Compile and preflight the expanded submission
        shell: bash
        run: |
          set -euo pipefail
          cd paper
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main > main.bibtex.log 2>&1 || { cat main.bibtex.log; exit 1; }
          cat main.bibtex.log
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error supplement.tex
          pdflatex -interaction=nonstopmode -halt-on-error supplement.tex
          ! grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations|Overfull \\hbox|Overfull \\vbox" main.log supplement.log
          test "$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')" -le 10
          pdftotext -f 7 -l 7 main.pdf /tmp/main-page7.txt
          pdftotext -f 8 -l 8 main.pdf /tmp/main-page8.txt
          grep -q "Conclusion" /tmp/main-page7.txt
          grep -q "References" /tmp/main-page8.txt
          for pdf in main.pdf supplement.pdf figures/*.pdf; do
            pdffonts "$pdf" | tail -n +3 | \
              awk '$0 ~ /Type 3|Identity-H/ || $(NF-4) != "yes" { bad=1 } END { exit bad }'
          done
          pdfinfo main.pdf | grep '^Pages:'
          pdfinfo supplement.pdf | grep '^Pages:'

      - name: Upload exact paper build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-aaai-paper-build
          path: |
            paper/main.pdf
            paper/supplement.pdf
            paper/main.log
            paper/supplement.log
            paper/main.aux
            paper/main.bbl
            paper/main.bibtex.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit the clean expanded release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .agent_expand .agent_payload
          rm -f .github/workflows/apply-expanded-paper.yml \
            .github/workflows/apply-prepared-update.yml \
            .reproduction-trigger .agent-payload-trigger .prepared-release-trigger
          git add -A
          git diff --cached --check
          git commit -m "Expand AAAI paper with diagnostics and proof exposition"
          git push origin HEAD:agent/expand-aaai-paper
