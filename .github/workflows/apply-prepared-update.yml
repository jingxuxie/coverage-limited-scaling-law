name: apply prepared research update

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sharp-anchor-stopping-rule
          fetch-depth: 0

      - name: Unpack prepared source update
        shell: bash
        run: |
          set -euo pipefail
          cat .agent_payload/part-* > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.tar.gz
          echo "841dc1c345628dc5d67bca97936abcfad1976adaecd723fdac84293c0a354cc5  /tmp/payload.tar.gz" | sha256sum --check
          tar -xzf /tmp/payload.tar.gz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        shell: bash
        run: python -m pip install -q -r requirements.txt

      - name: Reproduce the full experiment suite
        shell: bash
        run: |
          set -euo pipefail
          make full > /tmp/full.log 2>&1 || { tail -n 200 /tmp/full.log; exit 1; }
          tail -n 20 /tmp/full.log

      - name: Validate all result tables
        shell: bash
        run: |
          set -euo pipefail
          make validate > /tmp/validate.log 2>&1 || { cat /tmp/validate.log; exit 1; }
          cat /tmp/validate.log

      - name: Install figure and manuscript dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > /tmp/apt-update.log 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra cm-super dvipng poppler-utils \
            > /tmp/apt-install.log 2>&1
          command -v latex
          command -v dvipng
          kpsewhich newtxtext.sty || true
          kpsewhich newtxmath.sty || true
          python - <<'PY'
          import matplotlib
          print('matplotlib', matplotlib.__version__)
          PY

      - name: Regenerate publication figures
        shell: bash
        run: |
          set -euo pipefail
          if ! make figures > /tmp/figures.log 2>&1; then
            echo '===== COMPLETE FIGURE TRACEBACK ====='
            cat /tmp/figures.log
            echo '===== TEX LOCATIONS ====='
            kpsewhich newtxtext.sty || true
            kpsewhich newtxmath.sty || true
            latex --version | head -n 2 || true
            dvipng --version | head -n 2 || true
            exit 1
          fi
          cat /tmp/figures.log

      - name: Check Python sources
        run: python -m py_compile experiments/multi_active_replay.py experiments/plot_results.py experiments/validate_results.py

      - name: Compile manuscript and supplement
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/paper-check
          mkdir -p /tmp/paper-check
          cp -R paper AAAI_AuthorKit27 /tmp/paper-check/
          cd /tmp/paper-check/paper
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > /tmp/main-pass1.log
          bibtex main > /tmp/main-bib.log
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > /tmp/main-pass2.log
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > /tmp/main-pass3.log
          pdflatex -interaction=nonstopmode -halt-on-error supplement.tex > /tmp/supp-pass1.log
          pdflatex -interaction=nonstopmode -halt-on-error supplement.tex > /tmp/supp-pass2.log
          test "$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')" -le 7
          ! grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations|Overfull \\hbox|Overfull \\vbox" main.log supplement.log
          for figure in figures/*.pdf; do
            ! pdffonts "$figure" | tail -n +3 | grep -Eq 'Type 3|no[[:space:]]+no'
          done
          pdfinfo main.pdf | grep '^Pages:'
          pdfinfo supplement.pdf | grep '^Pages:'

      - name: Commit the reproduced release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md experiments notes paper
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Prepared update produced no changes" >&2
            exit 1
          fi
          git commit -m "Sharpen coactive replay theorem and add stopping rule"
          git push origin HEAD:agent/sharp-anchor-stopping-rule
